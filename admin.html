<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>창의융합프로젝트실 관리자</title>

  <link
    rel="stylesheet"
    href="./css/style.css"
  >
</head>

<body>
  <header class="header">
    <div>
      <h1>창의융합프로젝트실 관리자</h1>
      <p>207관 605-1호</p>
    </div>

    <nav>
      <a href="./index.html">이용 안내</a>

      <button
        id="refresh-button"
        type="button"
      >
        새로고침
      </button>

      <button
        id="logout-button"
        type="button"
      >
        로그아웃
      </button>
    </nav>
  </header>

  <main class="container">
    <div
      id="admin-message"
      class="message"
    ></div>

    <section class="card">
      <h2>가입 사용자 관리</h2>

      <p>
        이메일 인증 후 앱에 한 번 로그인한 사용자가
        표시됩니다.
      </p>

      <div id="user-list">
        사용자 정보를 불러오는 중입니다.
      </div>
    </section>

    <section class="card">
      <h2>전체 예약 관리</h2>

      <div class="filter-row">
        <label>
          예약 상태

          <select id="status-filter">
            <option value="all">전체</option>

            <option value="documents_pending">
              수료증 확인 대기
            </option>

            <option value="ready">
              이용 가능
            </option>

            <option value="completed">
              이용 완료
            </option>

            <option value="cancelled">
              취소
            </option>
          </select>
        </label>
      </div>

      <div id="admin-reservation-list">
        예약정보를 불러오는 중입니다.
      </div>
    </section>
  </main>

  <script
    type="module"
    src="./js/admin.js"
  ></script>
</body>
</html>
